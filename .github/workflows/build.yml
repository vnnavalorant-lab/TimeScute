name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # necessário só para anexar o jar a uma release (tags v*)

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Usa o Gradle instalado pela action; não precisa do gradlew no repositório.
      # Se você gerar o wrapper (gradle wrapper --gradle-version 8.8), troque por: ./gradlew build coreTests
      - name: Configurar o Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Compilar e rodar os testes do núcleo
        run: gradle build coreTests --stacktrace

      - name: Guardar o jar do mod
        uses: actions/upload-artifact@v4
        with:
          name: timescute-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publicar na release (só em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
